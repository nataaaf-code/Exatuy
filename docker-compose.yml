version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: examora-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Base schema, then the full data dump (runs last so it wins)
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/add_arena_and_notifications.sql:/docker-entrypoint-initdb.d/02-arena-notifications.sql:ro
      - ./backups/examora_db_full_20260617_141639.sql:/docker-entrypoint-initdb.d/03-full-dump.sql:ro
      - ./sql/add_quota_wallet.sql:/docker-entrypoint-initdb.d/04-quota-wallet.sql:ro
    command: --max_allowed_packet=1073741824 --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    networks:
      - examora-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Tomcat Application Server
  tomcat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examora-tomcat
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - TZ=Asia/Jakarta
      - DB_URL=jdbc:mysql://mysql:3306/examora_db?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
      - DB_USERNAME=examora_app
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - AI_SERVICE_BASE_URL=${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      # Kunci enkripsi kredensial pembayaran (AES-256). Wajib diisi di .env.
      - EXATUY_ENCRYPTION_KEY=${EXATUY_ENCRYPTION_KEY:-}
      - EXATUY_ALLOW_DEFAULT_KEY=${EXATUY_ALLOW_DEFAULT_KEY:-false}
      - CATALINA_OPTS=-Dorg.apache.catalina.connector.Response.DEFAULT_CHARSET=UTF-8 -Dorg.apache.coyote.http11.DefaultCharset=UTF-8
    volumes:
      - ./uploads:/app/uploads:rw
      - ./tomcat-conf/server.xml:/usr/local/tomcat/conf/server.xml:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - examora-network

  # AI & DS Microservice (FastAPI) — opsional, aktifkan dengan profil "ai":
  #   docker compose --profile ai up -d ai-service
  # Docs interaktif: http://localhost:8000/docs
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: examora-ai
    restart: unless-stopped
    profiles:
      - ai
    ports:
      # 8090 dipakai karena 8000/8001/8002 sudah terisi layanan lain di VPS ini.
      - "8090:8000"
    environment:
      - TZ=Asia/Jakarta
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - RAG_BACKEND=${RAG_BACKEND:-tfidf-faiss}
      - INTENT_MIN_CONFIDENCE=${INTENT_MIN_CONFIDENCE:-0.35}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - HEALTH_CHECK_DB=true
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-examora_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-examora_db}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - examora-network

volumes:
  mysql_data:

networks:
  examora-network:
    driver: bridge
